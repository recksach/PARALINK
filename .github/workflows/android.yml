name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/paralink-release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/paralink-release.jks \
              -storepass paralinkrc123 \
              -alias paralink \
              -keypass paralinkrc123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PARALINK, OU=Local Mesh, O=PARALINK, L=Local, ST=Mesh, C=US"
          fi
          echo "Keystore ready: $(ls -la keystore)"

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace
        env:
          PARALINK_KEYSTORE_PATH: ${{ github.workspace }}/keystore/paralink-release.jks
          PARALINK_KEYSTORE_PASSWORD: paralinkrc123
          PARALINK_KEY_ALIAS: paralink
          PARALINK_KEY_PASSWORD: paralinkrc123

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paralink-builds
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/bundle/*/release/*.aab

      - name: Publish builds to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/bundle/*/release/*.aab